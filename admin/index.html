<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Barbearia</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193128;background:#f5f7f4}*{box-sizing:border-box}body{margin:0} :root[data-theme='dark']{color:#eff7f0;background:#101714}.shell{max-width:1040px;margin:auto;padding:24px 16px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}h1{font-size:clamp(25px,5vw,36px);margin:0}h2{font-size:19px;margin:0 0 16px}.muted{color:#64766b}.card{background:#fff;border:1px solid #e0e9e2;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 5px 24px #17352508}.login{max-width:420px;margin:8vh auto}label{font-size:13px;font-weight:650;display:block;margin:16px 0 6px}input,select,button{font:inherit}input,select{width:100%;padding:13px;border:1px solid #d5dfd8;border-radius:11px;background:#fff;color:#183a2c}button,.btn{border:0;border-radius:11px;background:#1c6c4c;color:white;padding:12px 17px;cursor:pointer;font-weight:650}button:disabled{opacity:.55;cursor:wait}.ghost{background:#e8f1ea;color:#1c6c4c}.danger{background:#fce9e9;color:#a62c2c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{font-size:30px;display:block}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar>div{flex:1;min-width:180px}.toolbar label{margin-top:0}.booking{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;padding:18px 0;border-top:1px solid #edf0ec}.booking:first-child{border-top:0}.time{font-weight:800;font-size:21px}.name{font-weight:700}.meta{font-size:13px;color:#63796c;margin-top:5px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:9px 12px;font-size:13px}.pill{display:inline-block;font-size:12px;border-radius:30px;padding:4px 9px;background:#fff3d8;color:#876113;margin-left:6px}.pill.confirmed{background:#e2f5e9;color:#1b7246}.pill.cancelled{background:#f4e7e7;color:#944}.message{min-height:22px;color:#a33;font-size:14px;margin-top:12px}.hidden{display:none!important}@media(max-width:620px){.stats{grid-template-columns:repeat(3,1fr)}.card{padding:16px}.booking{grid-template-columns:1fr;gap:8px}.actions{justify-content:flex-start}.stat strong{font-size:24px}}

/* Tema escuro: automático pelo sistema, com opção manual persistida */
:root[data-theme="dark"]{color-scheme:dark;--bg:#101714;--card:#1b2620;--ink:#eff7f0;--muted:#a5b6ab;--line:#35483c;--accent:#7bd6a3;--soft:#263f30}
:root[data-theme="dark"] body{background:var(--bg,#101714);color:var(--ink,#eff7f0)}
:root[data-theme="dark"] .panel,:root[data-theme="dark"] .card,:root[data-theme="dark"] .service-choice,:root[data-theme="dark"] .field input,:root[data-theme="dark"] .field select,:root[data-theme="dark"] input,:root[data-theme="dark"] select,:root[data-theme="dark"] .slot{background:#1b2620;color:#eff7f0;border-color:#35483c}
:root[data-theme="dark"] .service-choice[aria-pressed=true]{background:#263f30;border-color:#7bd6a3}
:root[data-theme="dark"] .service-icon,:root[data-theme="dark"] .ghost{background:#2a3b30;color:#a9e7bf}
:root[data-theme="dark"] .slot[aria-pressed=true],:root[data-theme="dark"] .primary,:root[data-theme="dark"] button:not(.ghost):not(.danger):not(.slot):not(.service-choice):not(.theme-toggle){background:#377b57;color:#fff}
:root[data-theme="dark"] .bottom-nav{background:#16221bea;border-color:#35483c}
:root[data-theme="dark"] .appointment,:root[data-theme="dark"] .booking{border-color:#35483c}
:root[data-theme="dark"] .total-row strong,:root[data-theme="dark"] .topbar strong{color:#eff7f0}
:root[data-theme="dark"] .stat,:root[data-theme="dark"] .login{background:#1b2620}
:root[data-theme="dark"] .muted,:root[data-theme="dark"] .meta{color:#a5b6ab}
:root[data-theme="dark"] .pill{background:#493c25;color:#ffe1a0}
:root[data-theme="dark"] .pill.confirmed{background:#244833;color:#b4edc7}
:root[data-theme="dark"] .pill.cancelled,:root[data-theme="dark"] .danger{background:#4b2929;color:#ffc0c0}
.theme-toggle{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line,#dce3dc);border-radius:10px;background:transparent;color:inherit;padding:0;cursor:pointer;transition:background .15s,border-color .15s}.theme-toggle:hover{background:var(--soft,#e8f1ea)}.theme-toggle svg{width:17px;height:17px}
.theme-toggle:focus-visible{outline:3px solid #83d9a5;outline-offset:2px}
</style><link rel="stylesheet" href="/admin/finance.css"><script>(function(){const k='barberclub.theme.v1';let v;try{v=localStorage.getItem(k)}catch{}const m=window.matchMedia('(prefers-color-scheme: dark)');const apply=()=>{const dark=v==='dark'||(!v&&m.matches);document.documentElement.dataset.theme=dark?'dark':'light';const b=document.getElementById('theme-toggle');if(b){b.innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>';b.title=dark?'Ativar modo claro':'Ativar modo escuro';b.setAttribute('aria-label',b.title);b.setAttribute('aria-pressed',String(dark))}};window.addEventListener('DOMContentLoaded',()=>{const b=document.createElement('button');b.id='theme-toggle';b.className='theme-toggle';b.type='button';const header=document.querySelector('header');if(header)header.appendChild(b);b.addEventListener('click',()=>{v=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem(k,v)}catch{}apply()});apply()});if(m.addEventListener)m.addEventListener('change',()=>{if(!v)apply()});apply()})();</script></head><body><main class="shell"><header><div><div class="muted" style="font-size:13px">ÁREA RESTRITA</div><h1>Painel administrativo</h1></div><a href="/" class="muted">← Voltar ao site</a></header><section id="login" class="card login"><h2>Entrar na administração</h2><p class="muted">Use a conta de administrador cadastrada no Supabase.</p><form id="login-form"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="username"><label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password"><button style="width:100%;margin-top:20px" id="login-button">Entrar</button></form><p class="message" id="login-error" role="alert"></p></section><section id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px"><span class="muted" id="who"></span><button id="logout" class="ghost">Sair</button></div><div class="stats"><div class="card stat"><span class="muted">Total do dia</span><strong id="total">0</strong></div><div class="card stat"><span class="muted">Pendentes</span><strong id="pending">0</strong></div><div class="card stat"><span class="muted">Confirmados</span><strong id="confirmed">0</strong></div></div><section class="card"><div class="toolbar"><div><label for="date">Data</label><input id="date" type="date"></div><div><label for="barber">Profissional</label><select id="barber"><option value="">Todos</option><option>Profissional 1</option><option>Profissional 2</option></select></div><button id="refresh">Atualizar</button></div><p class="message" id="dashboard-error" role="status"></p></section><section class="card"><h2>Agendamentos</h2><div id="bookings" class="muted">Carregando…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const client=window.supabase.createClient('https://ovagalkdvdkfeplscmbc.supabase.co','sb_publishable_gJSpGHqn-3ZjGHkAJZO0xg_-wj3M73o');window.financeDb=client;const services={corte:'Corte masculino',barba:'Barba completa',combo:'Corte + barba'};let authorized=false;let currentUser=null;const fmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false});const dateFmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'});$('date').value=dateFmt.format(new Date());function message(id,text){$(id).textContent=text||''}function showLogin(){authorized=false;$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')}function showDashboard(){authorized=true;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('who').textContent=currentUser?.email||''}async function check(){const {data:{user},error}=await client.auth.getUser();if(error||!user){showLogin();return}currentUser=user;const {data, error:roleError}=await client.from('perfis').select('id,tipo').eq('id',user.id).eq('tipo','admin').maybeSingle();if(roleError||!data){showLogin();message('login-error',roleError?'Banco ainda não configurado. Contate o responsável.':'Esta conta não possui permissão administrativa.');return}showDashboard();await load()}async function load(){if(!authorized)return;message('dashboard-error','');$('bookings').textContent='Carregando…';const day=$('date').value;if(!day)return;let q=client.from('agendamentos').select('id,nome,telefone,servico,profissional,data,horario,status').eq('data',day).order('horario');if($('barber').value)q=q.eq('profissional',$('barber').value);const {data,error}=await q;if(error){message('dashboard-error','Não foi possível consultar os agendamentos: '+error.message);$('bookings').textContent='Não foi possível carregar.';return}const rows=data||[];$('total').textContent=rows.filter(b=>b.status!=='Cancelado').length;$('pending').textContent=rows.filter(b=>b.status==='Pendente').length;$('confirmed').textContent=rows.filter(b=>b.status==='Confirmado').length;$('bookings').replaceChildren();if(!rows.length){$('bookings').textContent='Nenhum agendamento nesta data.';return}for(const b of rows){const el=document.createElement('div');el.className='booking';const time=document.createElement('div');time.className='time';time.textContent=b.horario;const info=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=b.nome;const pill=document.createElement('span');pill.className='pill '+(b.status==='Confirmado'?'confirmed':b.status==='Cancelado'?'cancelled':b.status==='Concluído'?'confirmed':'');pill.textContent=b.status;name.append(pill);const meta=document.createElement('div');meta.className='meta';meta.textContent=[services[b.servico]||b.servico,b.profissional,b.telefone].join(' · ');info.append(name,meta);const actions=document.createElement('div');actions.className='actions';if(b.status==='Pendente'){actions.append(action('Confirmar','ghost',()=>change(b.id,'Confirmado')))}if(b.status==='Confirmado'||b.status==='Pendente'){actions.append(action('Concluído','ghost',()=>change(b.id,'Concluído')))}if(b.status!=='Cancelado'&&b.status!=='Concluído'){actions.append(action('Cancelar','danger',()=>change(b.id,'Cancelado')))}const wa=document.createElement('a');wa.className='btn ghost';wa.textContent='WhatsApp';wa.href='https://wa.me/55'+b.telefone.replace(/\D/g,'');wa.target='_blank';wa.rel='noopener noreferrer';actions.append(wa);el.append(time,info,actions);$('bookings').append(el)}}function action(label,cls,fn){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.onclick=fn;return b}async function change(id,status){if(!authorized)return;if(status==='Cancelado'&&!confirm('Cancelar este agendamento?'))return;const {error}=await client.from('agendamentos').update({status}).eq('id',id);if(error){message('dashboard-error','Erro ao atualizar: '+error.message);return}await load()}$('login-form').addEventListener('submit',async e=>{e.preventDefault();message('login-error','');$('login-button').disabled=true;const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('login-button').disabled=false;if(error){message('login-error','E-mail ou senha inválidos.');return}await check()});$('logout').onclick=async()=>{await client.auth.signOut();currentUser=null;showLogin()};$('refresh').onclick=load;$('date').onchange=load;$('barber').onchange=load;check()})();
</script><script src="/admin/finance.js" defer></script><script src="/admin/revenue.js" defer></script></body></html>
