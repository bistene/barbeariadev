<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel | Barbearia</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193128;background:#f5f7f4}*{box-sizing:border-box}body{margin:0}.shell{max-width:1040px;margin:auto;padding:24px 16px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}h1{font-size:clamp(25px,5vw,36px);margin:0}h2{font-size:19px;margin:0 0 16px}.muted{color:#64766b}.card{background:#fff;border:1px solid #e0e9e2;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 5px 24px #17352508}.login{max-width:420px;margin:8vh auto}label{font-size:13px;font-weight:650;display:block;margin:16px 0 6px}input,select,button{font:inherit}input,select{width:100%;padding:13px;border:1px solid #d5dfd8;border-radius:11px;background:#fff;color:#183a2c}button,.btn{border:0;border-radius:11px;background:#1c6c4c;color:white;padding:12px 17px;cursor:pointer;font-weight:650}button:disabled{opacity:.55;cursor:wait}.ghost{background:#e8f1ea;color:#1c6c4c}.danger{background:#fce9e9;color:#a62c2c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat strong{font-size:30px;display:block}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.toolbar>div{flex:1;min-width:180px}.toolbar label{margin-top:0}.booking{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;padding:18px 0;border-top:1px solid #edf0ec}.booking:first-child{border-top:0}.time{font-weight:800;font-size:21px}.name{font-weight:700}.meta{font-size:13px;color:#63796c;margin-top:5px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:9px 12px;font-size:13px}.pill{display:inline-block;font-size:12px;border-radius:30px;padding:4px 9px;background:#fff3d8;color:#876113;margin-left:6px}.pill.confirmed{background:#e2f5e9;color:#1b7246}.pill.cancelled{background:#f4e7e7;color:#944}.message{min-height:22px;color:#a33;font-size:14px;margin-top:12px}.hidden{display:none!important}@media(max-width:620px){.stats{grid-template-columns:repeat(3,1fr)}.card{padding:16px}.booking{grid-template-columns:1fr;gap:8px}.actions{justify-content:flex-start}.stat strong{font-size:24px}}
</style></head><body><main class="shell"><header><div><div class="muted" style="font-size:13px">ÁREA RESTRITA</div><h1>Painel administrativo</h1></div><a href="/" class="muted">← Voltar ao site</a></header><section id="login" class="card login"><h2>Entrar na administração</h2><p class="muted">Use a conta de administrador cadastrada no Supabase.</p><form id="login-form"><label for="email">E-mail</label><input id="email" type="email" required autocomplete="username"><label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password"><button style="width:100%;margin-top:20px" id="login-button">Entrar</button></form><p class="message" id="login-error" role="alert"></p></section><section id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px"><span class="muted" id="who"></span><button id="logout" class="ghost">Sair</button></div><div class="stats"><div class="card stat"><span class="muted">Total do dia</span><strong id="total">0</strong></div><div class="card stat"><span class="muted">Pendentes</span><strong id="pending">0</strong></div><div class="card stat"><span class="muted">Confirmados</span><strong id="confirmed">0</strong></div></div><section class="card"><div class="toolbar"><div><label for="date">Data</label><input id="date" type="date"></div><div><label for="barber">Profissional</label><select id="barber"><option value="">Todos</option><option>Profissional 1</option><option>Profissional 2</option></select></div><button id="refresh">Atualizar</button></div><p class="message" id="dashboard-error" role="status"></p></section><section class="card"><h2>Agendamentos</h2><div id="bookings" class="muted">Carregando…</div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const client=window.supabase.createClient('https://ovagalkdvdkfeplscmbc.supabase.co','sb_publishable_gJSpGHqn-3ZjGHkAJZO0xg_-wj3M73o');const services={corte:'Corte masculino',barba:'Barba completa',combo:'Corte + barba'};let authorized=false;let currentUser=null;const fmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false});const dateFmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'});$('date').value=dateFmt.format(new Date());function message(id,text){$(id).textContent=text||''}function showLogin(){authorized=false;$('dashboard').classList.add('hidden');$('login').classList.remove('hidden')}function showDashboard(){authorized=true;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('who').textContent=currentUser?.email||''}async function check(){const {data:{user},error}=await client.auth.getUser();if(error||!user){showLogin();return}currentUser=user;const {data, error:roleError}=await client.from('perfis').select('id,tipo').eq('id',user.id).eq('tipo','admin').maybeSingle();if(roleError||!data){showLogin();message('login-error',roleError?'Banco ainda não configurado. Contate o responsável.':'Esta conta não possui permissão administrativa.');return}showDashboard();await load()}async function load(){if(!authorized)return;message('dashboard-error','');$('bookings').textContent='Carregando…';const day=$('date').value;if(!day)return;let q=client.from('agendamentos').select('id,nome,telefone,servico,profissional,data,horario,status').eq('data',day).order('horario');if($('barber').value)q=q.eq('profissional',$('barber').value);const {data,error}=await q;if(error){message('dashboard-error','Não foi possível consultar os agendamentos: '+error.message);$('bookings').textContent='Não foi possível carregar.';return}const rows=data||[];$('total').textContent=rows.filter(b=>b.status!=='Cancelado').length;$('pending').textContent=rows.filter(b=>b.status==='Pendente').length;$('confirmed').textContent=rows.filter(b=>b.status==='Confirmado').length;$('bookings').replaceChildren();if(!rows.length){$('bookings').textContent='Nenhum agendamento nesta data.';return}for(const b of rows){const el=document.createElement('div');el.className='booking';const time=document.createElement('div');time.className='time';time.textContent=b.horario;const info=document.createElement('div');const name=document.createElement('div');name.className='name';name.textContent=b.nome;const pill=document.createElement('span');pill.className='pill '+(b.status==='Confirmado'?'confirmed':b.status==='Cancelado'?'cancelled':'');pill.textContent=b.status;name.append(pill);const meta=document.createElement('div');meta.className='meta';meta.textContent=[services[b.servico]||b.servico,b.profissional,b.telefone].join(' · ');info.append(name,meta);const actions=document.createElement('div');actions.className='actions';if(b.status==='Pendente'){actions.append(action('Confirmar','ghost',()=>change(b.id,'Confirmado')))}if(b.status!=='Cancelado'){actions.append(action('Cancelar','danger',()=>change(b.id,'Cancelado')))}const wa=document.createElement('a');wa.className='btn ghost';wa.textContent='WhatsApp';wa.href='https://wa.me/55'+b.telefone.replace(/\D/g,'');wa.target='_blank';wa.rel='noopener noreferrer';actions.append(wa);el.append(time,info,actions);$('bookings').append(el)}}function action(label,cls,fn){const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.onclick=fn;return b}async function change(id,status){if(!authorized)return;if(status==='Cancelado'&&!confirm('Cancelar este agendamento?'))return;const {error}=await client.from('agendamentos').update({status}).eq('id',id);if(error){message('dashboard-error','Erro ao atualizar: '+error.message);return}await load()}$('login-form').addEventListener('submit',async e=>{e.preventDefault();message('login-error','');$('login-button').disabled=true;const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('login-button').disabled=false;if(error){message('login-error','E-mail ou senha inválidos.');return}await check()});$('logout').onclick=async()=>{await client.auth.signOut();currentUser=null;showLogin()};$('refresh').onclick=load;$('date').onchange=load;$('barber').onchange=load;check()})();
</script></body></html>
