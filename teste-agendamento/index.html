<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>Teste | Agendamento por etapas</title><style>:root{--bg:#f7f7f5;--card:#fff;--text:#1d2521;--muted:#748079;--border:#e4e9e5;--accent:#1c6c4c;--soft:#e8f4ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}.wrap{max-width:510px;margin:auto;padding:20px 18px 100px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:var(--accent);font-size:13px;text-decoration:none;font-weight:700}.theme{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px}.pill{display:inline-block;margin-top:24px;background:var(--soft);color:var(--accent);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.07em}h1{font-size:29px;line-height:1.15;letter-spacing:-1px;margin:14px 0 8px}p{color:var(--muted);margin:0 0 18px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:22px 0 25px}.progress span{height:5px;border-radius:5px;background:var(--border)}.progress span.active{background:var(--accent)}.panel{background:var(--card);border:1px solid var(--border);border-radius:19px;padding:20px;box-shadow:0 8px 24px #16291b08}h2{font-size:18px;margin:0 0 18px}.choices{display:grid;gap:10px}.choice{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:16px;border:1.5px solid var(--border);background:var(--card);color:var(--text);border-radius:13px;cursor:pointer}.choice.selected,.slot.selected{border-color:var(--accent);background:var(--soft)}small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.price{font-weight:800;color:var(--accent)}label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input,select{width:100%;height:49px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--text);padding:0 12px;font:inherit}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.slot{padding:11px 2px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer}.actions{display:flex;gap:10px;margin-top:18px}.actions button{height:52px;border-radius:12px;border:0;font-weight:800;cursor:pointer}.back{width:95px;background:var(--soft);color:var(--accent)}.next{flex:1;background:var(--accent);color:white}.next:disabled{opacity:.45;cursor:not-allowed}.summary{display:grid;gap:11px}.summary div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);padding-bottom:10px}.summary strong{text-align:right}.notice{margin-top:15px;padding:12px;border-radius:11px;background:var(--soft);font-size:12px;color:var(--accent)}.hide{display:none}.hint{font-size:12px;margin-top:12px}body.dark{--bg:#101714;--card:#1b2620;--text:#eff7f0;--muted:#a5b6ab;--border:#34483b;--accent:#65c18a;--soft:#253c2e}</style></head><body><main class="wrap"><div class="top"><a href="/">← Voltar ao site</a><button class="theme" id="theme" type="button" aria-label="Alternar tema">☾ / ☀</button></div><span class="pill">DEMONSTRAÇÃO • NÃO REGISTRA PEDIDOS</span><h1>Marque seu horário.</h1><p>Simples, rápido e do seu jeito.</p><div class="progress" id="progress"></div><section class="panel"><h2 id="heading"></h2><div id="content"></div></section><div class="actions"><button class="back" id="back" type="button">Voltar</button><button class="next" id="next" type="button">Continuar →</button></div><p class="hint">Este é apenas um teste visual. Nenhum horário será reservado e nenhum dado será enviado.</p></main><script>const services=[{id:"corte",name:"Corte de cabelo",duration:30,price:45},{id:"barba",name:"Barba",duration:30,price:35},{id:"combo",name:"Corte + barba",duration:60,price:70}];let step=0;const data={service:null,barber:"Profissional 1",date:"",time:"",name:"",phone:"",payment:"signal"};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function draw(){const headings=["1. Escolha seu serviço","2. Escolha dia e horário","3. Seus dados","4. Confira seu pedido","Teste concluído"]; $("heading").textContent=headings[step];$("progress").innerHTML=Array.from({length:4},(_,i)=>'<span class="'+(i<=step?'active':'')+'"></span>').join("");$("back").style.display=step===0||step===4?"none":"";$("next").style.display=step===4?"none":"";$("next").textContent=step===3?"Finalizar teste":"Continuar →";if(step===0){$("content").innerHTML='<div class="choices">'+services.map(s=>'<button class="choice '+(data.service===s.id?'selected':'')+'" data-service="'+s.id+'"><span><strong>'+s.name+'</strong><small>'+s.duration+' minutos</small></span><span class="price">R$ '+s.price+'</span></button>').join("")+'</div>';document.querySelectorAll("[data-service]").forEach(b=>b.onclick=()=>{data.service=b.dataset.service;draw()})}if(step===1){$("content").innerHTML='<label for="barber">Profissional</label><select id="barber"><option>Profissional 1</option><option>Profissional 2</option></select><label for="date">Data</label><input id="date" type="date" min="'+new Date().toLocaleDateString("en-CA")+'"><label>Horários de exemplo</label><div class="slots">'+["09:00","10:00","11:00","13:00","14:00","15:00","16:00","17:00"].map(t=>'<button class="slot '+(data.time===t?'selected':'')+'" data-time="'+t+'">'+t+'</button>').join("")+'</div><p class="hint">Horários ilustrativos, sem consulta à agenda real.</p>';$("barber").value=data.barber;$("date").value=data.date;$("barber").onchange=e=>data.barber=e.target.value;$("date").onchange=e=>data.date=e.target.value;document.querySelectorAll("[data-time]").forEach(b=>b.onclick=()=>{data.time=b.dataset.time;draw()})}if(step===2){$("content").innerHTML='<label for="name">Seu nome</label><input id="name" autocomplete="name" placeholder="Como podemos te chamar?"><label for="phone">Celular / WhatsApp</label><input id="phone" type="tel" autocomplete="tel" placeholder="(21) 99999-9999">';$("name").value=data.name;$("phone").value=data.phone;$("name").oninput=e=>data.name=e.target.value;$("phone").oninput=e=>data.phone=e.target.value}if(step===3){const s=services.find(s=>s.id===data.service);$("content").innerHTML='<div class="summary">'+[["Serviço",s.name],["Profissional",data.barber],["Data",data.date.split("-").reverse().join("/")],["Horário",data.time],["Cliente",data.name],["WhatsApp",data.phone],["Valor","R$ "+s.price]].map(([a,b])=>'<div><span>'+a+'</span><strong>'+esc(b)+'</strong></div>').join("")+'</div><label for="payment">Pagamento (simulação)</label><select id="payment"><option value="signal">Sinal de R$ 15</option><option value="full">Valor integral</option></select><div class="notice">Nenhum pagamento será realizado. A confirmação é apenas demonstrativa.</div>';$("payment").value=data.payment;$("payment").onchange=e=>data.payment=e.target.value}if(step===4){$("content").innerHTML='<p>Você concluiu o fluxo de demonstração. Nenhum agendamento foi criado.</p><button class="next" type="button" id="again" style="width:100%">Testar novamente</button>';$("again").onclick=()=>{step=0;draw()}}$("next").disabled=step===0&&!data.service} $("next").onclick=()=>{if(step===1&&(!data.date||!data.time)){alert("Selecione a data e um horário de exemplo.");return}if(step===2&&(!data.name.trim()||data.phone.replace(/\D/g,"").length<10)){alert("Informe seu nome e um WhatsApp válido para continuar.");return}if(step<4)step++;draw()};$("back").onclick=()=>{if(step>0)step--;draw()};$("theme").onclick=()=>{document.body.classList.toggle("dark");localStorage.setItem("demo-booking-theme",document.body.classList.contains("dark")?"dark":"light")};if(localStorage.getItem("demo-booking-theme")==="dark")document.body.classList.add("dark");draw();</script></body></html>
